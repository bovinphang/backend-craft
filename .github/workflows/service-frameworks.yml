name: Service framework boundary examples
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r skills/bec-fastapi-project-standard/examples/minimal/requirements.txt
      - run: pnpm exec node --import tsx --test tests/frameworks/fastapi.test.ts
      - run: pnpm run verify:frameworks -- --framework gin,drogon,axum,spring-boot --prepare
