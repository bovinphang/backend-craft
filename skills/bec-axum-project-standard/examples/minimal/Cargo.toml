[package]
name = "craft-axum-contract"
version = "0.1.0"
edition = "2021"
publish = false

[features]
defective = []

[dependencies]
axum = "=0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
